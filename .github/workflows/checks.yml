name: Scientific checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev,teaching,reproduce]'
      - run: python tools/verify_frozen_inputs.py
      - run: python tools/verify_input_data.py
      - run: python debug/verify_package.py
      - run: python debug/verify_calculation_steps.py
      - run: python debug/verify_dashboard_metrics.py
      - run: python debug/verify_parameter_diagnostics.py
      - run: python debug/capacity_sensitivity/verify_analysis.py
      - run: node debug/verify_parameter_page.js
      - run: python debug/full_experiment/scripts/build_precalibration_trace.py
      - run: python debug/full_experiment/scripts/build_emission_steps.py
      - run: python debug/full_experiment/scripts/build_other_experiment_trace.py
      - run: python debug/capacity_sensitivity/scripts/build_capacity_sensitivity.py
      - run: python debug/capacity_sensitivity/scripts/build_capacity_report.py
      - run: python debug/capacity_sensitivity/verify_analysis.py --directory debug/output/capacity_sensitivity
      - run: python debug/full_experiment/scripts/build_episode_time_series.py --skip-figures --capacity-source debug/output/capacity_sensitivity
      - run: python debug/verify_dashboard_metrics.py --directory debug/output/episode_time_series
      - run: python debug/verify_parameter_diagnostics.py --directory debug/output/episode_time_series
      - run: node debug/verify_parameter_page.js debug/output/episode_time_series/traffic_parameters.html
      - run: python debug/sensor78/step_by_step/build_steps.py
      - run: python debug/case_studies/az_i10_detector141_november/scripts/build_case_study.py
      - run: python -m qvdfe.pipeline check-inputs --data-root data/inputs/empirical/source_files --baseline data/inputs/empirical/baseline --emission-input data/frozen/calibration/emission_input
      - run: python debug/episodes_137/scripts/analyze_episodes.py
      - run: python debug/episodes_137/scripts/review_calibration.py
      - run: python debug/episodes_137/scripts/attribution_review.py
      - run: python debug/episodes_137/scripts/check_speed_identity.py
      - run: python debug/episodes_137/scripts/verify_results.py
      - run: python debug/sensor78/scripts/reproduce.py
      - run: python -m pytest -q
      - run: python reproduce/run_all.py --skip-figures
      - run: python tools/make_formula_code_map.py
      - run: git diff --exit-code -- FORMULA_CODE_MAP.md
      - run: python -m qvdfe.pipeline --help
